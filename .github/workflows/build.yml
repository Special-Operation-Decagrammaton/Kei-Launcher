name: Build Multi-Platform Executables (Windows & Linux)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Windows Native AOT
      run: dotnet publish -r win-x64 -c Release -o publish-win

    - name: Package Windows Artifact
      shell: pwsh
      run: Compress-Archive -Path "publish-win\*" -DestinationPath "KeiLauncher-Windows-x64.zip"

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KeiLauncher-Windows-x64
        path: KeiLauncher-Windows-x64.zip
        retention-days: 90

  build-linux:
    name: Build Linux Standalone Binary
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev libx11-dev libice6 libsm6 libfontconfig1

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Publish Linux Native AOT
      run: dotnet publish -r linux-x64 -c Release -o publish-linux

    - name: Package Linux Artifact
      run: |
        chmod +x publish-linux/KeiLauncher
        tar -czvf KeiLauncher-Linux-x64.tar.gz -C publish-linux .

    - name: Upload Linux Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KeiLauncher-Linux-x64
        path: KeiLauncher-Linux-x64.tar.gz
        retention-days: 90

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: KeiLauncher-Windows-x64
        path: release_files

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: KeiLauncher-Linux-x64
        path: release_files

    - name: Publish Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_files/KeiLauncher-Windows-x64.zip
          release_files/KeiLauncher-Linux-x64.tar.gz
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}