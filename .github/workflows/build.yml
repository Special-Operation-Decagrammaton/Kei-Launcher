name: Build Multi-Platform Executables (Windows & Linux)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Windows Standalone Executable
      run: |
        pyinstaller --noconsole --onefile --clean `
          --icon="asset/kei.ico" `
          --name "Kei_Launcher" `
          --add-data "asset;asset" `
          --collect-all customtkinter `
          --collect-all UnityPy `
          --collect-all PIL `
          main.py

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kei_Launcher-Windows
        path: dist/Kei_Launcher.exe
        retention-days: 90

  build-linux:
    name: Build Linux Standalone Binary
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies (Tkinter / X11)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk tk-dev libx11-dev libxext-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Linux Standalone Executable
      run: |
        pyinstaller --noconsole --onefile --clean \
          --icon="asset/kei.png" \
          --name "Kei_Launcher-Linux" \
          --add-data "asset:asset" \
          --collect-all customtkinter \
          --collect-all UnityPy \
          --collect-all PIL \
          main.py
        chmod +x dist/Kei_Launcher-Linux

    - name: Upload Linux Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kei_Launcher-Linux
        path: dist/Kei_Launcher-Linux
        retention-days: 90

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: Kei_Launcher-Windows
        path: release_files

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: Kei_Launcher-Linux
        path: release_files

    - name: Publish Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_files/Kei_Launcher.exe
          release_files/Kei_Launcher-Linux
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}