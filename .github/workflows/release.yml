name: Release

on:
  workflow_dispatch:
    inputs:
      release-name:
        description: "The name for the new release"
        required: true
        default: 'v1.1.0'
      release-tag:
        description: "The tag for the new release (e.g. v1.1.0)"
        required: true
        default: 'v1.1.0'

jobs:
  build-and-release:
    name: Build & Release for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            rid: win-x64
            archive: KeiLauncher-Windows-x64.zip
          - os: linux
            runner: ubuntu-latest
            rid: linux-x64
            archive: KeiLauncher-Linux-x64.tar.gz

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: matrix.os == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev libx11-dev libice6 libsm6 libfontconfig1

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Native AOT
      run: dotnet publish -r ${{ matrix.rid }} -c Release -o publish-${{ matrix.os }}

    - name: Package Windows Archive
      if: matrix.os == 'windows'
      shell: pwsh
      run: Compress-Archive -Path "publish-${{ matrix.os }}\*" -DestinationPath "${{ matrix.archive }}"

    - name: Package Linux Archive
      if: matrix.os == 'linux'
      run: |
        chmod +x publish-${{ matrix.os }}/KeiLauncher
        tar -czvf ${{ matrix.archive }} -C publish-${{ matrix.os }} .

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: ${{ matrix.archive }}
        name: ${{ github.event.inputs.release-name }}
        tag_name: ${{ github.event.inputs.release-tag }}
        generate_release_notes: ${{ matrix.os == 'windows' }}